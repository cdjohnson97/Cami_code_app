# Lancer CaMI en conditions de production sur ta machine (ou sur un serveur avec Docker) :
#
#   cp .env.docker.example .env.docker   # puis remplis les valeurs
#   docker compose up -d --build
#   → http://localhost:3100  (port modifiable : CAMI_PORT=8000 docker compose up -d)
#
# Pour le déploiement chez un hébergeur, voir DEPLOY.md.
services:
  cami:
    build:
      context: .
      args:
        CAMI_CLOUD_ENABLED: "true"
    image: cami:latest
    ports:
      - "${CAMI_PORT:-3100}:3000"
    # Secrets lus au lancement, jamais copiés dans l'image.
    env_file: .env.docker
    restart: unless-stopped
